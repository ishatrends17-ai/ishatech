
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .welcome-icon {
            font-size: 75px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 30px;
            color: #333;
            margin-bottom: 15px;
        }

        p {
            font-size: 15px;
            color: #777;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .start-btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .start-btn:hover {
            opacity: 0.9;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="welcome-card">

        <div class="welcome-icon">👋</div>

        <h1>Welcome!</h1>

        <p>
            We're happy to have you here.
            Discover amazing features and enjoy
            your experience with us.
        </p>

        <button class="start-btn" onclick="startApp()">
            Get Started →
        </button>

        <div class="footer">
            © 2026 All Rights Reserved
        </div>

    </div>

    <script>
        function startApp() {
            alert("Welcome! Let's Get Started.");
        }
    </script>

</body>
</html>
